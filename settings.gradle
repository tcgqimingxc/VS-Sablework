pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        // ModDevGradle 的插件本体（离线可用，见 ~/.gradle/caches 中的 net.neoforged:moddev-gradle）
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    resolutionStrategy {
        eachPlugin {
            // 直接用模块坐标解析插件，避免依赖插件门户上的 marker POM（本机缓存里没有 2.0.141 的 marker）
            if (requested.id.id == 'net.neoforged.moddev') {
                useModule("net.neoforged:moddev-gradle:${requested.version}")
            }
        }
    }
}

rootProject.name = 'clockwork-1.21.1'
