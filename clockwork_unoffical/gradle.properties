# ===== Gradle 基本设置 =====
# 本机网络受限（maven.neoforged.net 不可达），因此构建依赖本机 Gradle 缓存 + libs/ 本地 jar。
# 若你的机器能访问 https://maven.neoforged.net，可去掉 --offline 使用在线构建。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存与 ModDevGradle 的 NeoForm 任务偶有冲突，这里关闭以保证可复现
org.gradle.configuration-cache=false

# JDK 21（NeoForge 1.21.1 要求 Java 21）；本机已装 Dragonwell 21
org.gradle.java.installations.paths=C:/Users/yql11/java/dragonwell-21.0.8.0.8+9-GA,C:/Users/yql11/AppData/Roaming/PrismLauncher/java/java-runtime-delta

# ===== Minecraft / NeoForge =====
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# 本机 Gradle 缓存中已有 21.1.228 与 21.1.249 的 userdev/universal 包
neo_version=21.1.228
loader_version_range=[4,)

# ===== Mod 元数据 =====
mod_id=vs_clockwork
mod_name=Clockwork
mod_license=Apache-2.0
mod_version=0.6.0-1.21.1
mod_group_id=org.valkyrienskies.clockwork
mod_authors=TCGqimingxc, Deepseek
mod_description=Clockwork: Create x Aeronautics. Physics contraptions, gas logistics and curiosities built on Sable sub-levels.

